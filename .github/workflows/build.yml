name: Build Pake App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build App
        run: |
          npx pake-cli@2.0.6 http://localhost:5200 --name "Readers" --transparent --width 420 --height 800

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Readers-Windows
          path: src-tauri/target/release/bundle/msi/*.msi
